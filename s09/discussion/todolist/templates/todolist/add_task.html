{% extends 'base.html' %}

{% block title %}Add Task{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6 offset-3">
            <h1 class="text-center my-3">Add Task</h1>

            {% if error %}
                <p class="text-danger">{{ error }}</p>
            {% endif %}

            <form action="{% url 'todolist:add_task' %}" method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="task_name">Task Name: </label>
                    <input class="form-control" id="task_name" type="text" name="task_name" maxlength="50" required>
                </div>

                <div class="mb-3">
                    <label for="description">Description: </label>
                    <input class="form-control" id="description" type="text" name="description" maxlength="200" required>
                </div>

                <div class="text-center">
                    <input class="btn btn-success" type="submit" value="Add Task">
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
